<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <script src="theme-init.js"></script>
    <link
      rel="preload"
      href="fonts/Satoshi-Variable.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="fonts/Cookie-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <nav
      id="bookmarks-bar"
      data-i18n-aria-label="bookmarksBarLabel"
      aria-label="Bookmarks bar"
    ></nav>
    <main id="content">
      <input
        id="search-input"
        type="search"
        autocomplete="off"
        spellcheck="false"
        data-i18n-placeholder="searchPlaceholder"
        data-i18n-aria-label="searchAriaLabel"
        aria-label="Search"
      />
      <div id="clock"></div>
    </main>

    <div id="bg-attribution" hidden>
      <a id="bg-unsplash-link" target="_blank" rel="noopener" data-i18n="attrUnsplash">Unsplash</a>
      <span class="bg-attribution-sep" aria-hidden="true">•</span>
      <a id="bg-author" target="_blank" rel="noopener"></a>
      <span class="bg-attribution-sep" aria-hidden="true">•</span>
      <a id="bg-photo-link" target="_blank" rel="noopener" data-i18n="attrPhoto">Photo</a>
    </div>

    <button
      id="settings-btn"
      type="button"
      data-i18n-aria-label="settingsButtonLabel"
      aria-label="Settings"
      aria-expanded="false"
      aria-controls="settings-panel"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </button>

    <div
      id="settings-panel"
      role="dialog"
      data-i18n-aria-label="settingsPanelLabel"
      aria-label="Settings"
      aria-labelledby="settings-heading"
      hidden
    >
      <h2 id="settings-heading" data-i18n="settingsHeading">Settings</h2>

      <button
        type="button"
        class="setting setting-action"
        id="open-folder-emojis"
        aria-haspopup="dialog"
        aria-controls="folder-emoji-overlay"
      >
        <span data-i18n="folderEmojisLabel">Folder emojis</span>
        <span class="setting-action-chevron" aria-hidden="true">›</span>
      </button>

      <label class="setting">
        <span data-i18n="centerBookmarks">Center bookmarks in bar</span>
        <input type="checkbox" data-setting="centerBookmarks" />
        <span class="switch" aria-hidden="true"></span>
      </label>

      <label class="setting">
        <span data-i18n="hideLabels">Hide labels</span>
        <input type="checkbox" data-setting="hideLabels" />
        <span class="switch" aria-hidden="true"></span>
      </label>

      <label class="setting">
        <span data-i18n="tabGroupsLabel">Tab groups</span>
        <input type="checkbox" data-setting="tabGroupsEnabled" />
        <span class="switch" aria-hidden="true"></span>
      </label>

      <label class="setting">
        <span data-i18n="showBackgroundImage">Show background image</span>
        <input type="checkbox" data-setting="backgroundEnabled" />
        <span class="switch" aria-hidden="true"></span>
      </label>

      <div class="setting setting-text">
        <span id="center-widget-label" data-i18n="centerLabel">Center</span>
        <div
          class="toggle-group"
          role="radiogroup"
          aria-labelledby="center-widget-label"
          data-setting="centerWidget"
        >
          <button type="button" role="radio" data-value="clock" data-i18n="centerClock">Clock</button>
          <button type="button" role="radio" data-value="search" data-i18n="centerSearch">Search</button>
          <button type="button" role="radio" data-value="none" data-i18n="centerNone">None</button>
        </div>
      </div>

      <div class="setting setting-text" id="setting-clock-size">
        <span id="clock-size-label" data-i18n="clockSizeLabel">Clock size</span>
        <input
          type="range"
          data-setting="clockSize"
          min="60"
          max="160"
          step="5"
          aria-labelledby="clock-size-label"
        />
      </div>

      <div class="setting setting-text">
        <span id="theme-label" data-i18n="themeLabel">Theme</span>
        <div
          class="toggle-group"
          role="radiogroup"
          aria-labelledby="theme-label"
          data-setting="theme"
        >
          <button type="button" role="radio" data-value="auto" data-i18n="themeAuto">Auto</button>
          <button type="button" role="radio" data-value="light" data-i18n="themeLight">Light</button>
          <button type="button" role="radio" data-value="dark" data-i18n="themeDark">Dark</button>
        </div>
      </div>

      <div class="setting setting-text">
        <span id="style-label" data-i18n="styleLabel">Style</span>
        <div
          class="toggle-group"
          role="radiogroup"
          aria-labelledby="style-label"
          data-setting="style"
        >
          <button type="button" role="radio" data-value="glass" data-i18n="styleGlass">Glass</button>
          <button type="button" role="radio" data-value="classic" data-i18n="styleClassic">Classic</button>
        </div>
      </div>

      <div class="setting setting-text">
        <span id="bookmarks-position-label" data-i18n="bookmarksPositionLabel">Bookmarks position</span>
        <div
          class="toggle-group"
          role="radiogroup"
          aria-labelledby="bookmarks-position-label"
          data-setting="bookmarksPosition"
        >
          <button type="button" role="radio" data-value="top" data-i18n="bookmarksPositionTop">Top</button>
          <button type="button" role="radio" data-value="bottom" data-i18n="bookmarksPositionBottom">Bottom</button>
        </div>
      </div>

      <label class="setting setting-text" id="setting-bg-interval">
        <span data-i18n="refreshIntervalLabel">Refresh background every</span>
        <select data-setting="backgroundIntervalHours">
          <option value="1" data-i18n="interval1h">1 hour</option>
          <option value="6" data-i18n="interval6h">6 hours</option>
          <option value="12" data-i18n="interval12h">12 hours</option>
          <option value="24" data-i18n="interval24h">24 hours</option>
        </select>
      </label>

      <div
        class="setting bg-error"
        id="setting-bg-error"
        role="status"
        aria-live="polite"
        hidden
      >
        <span data-i18n="bgErrorMessage"
          >Couldn't load wallpaper. Will retry automatically.</span
        >
      </div>

      <div class="bmc-section">
        <a
          class="bmc-link"
          href="https://www.buymeacoffee.com/alejandro.lacasa"
          target="_blank"
          rel="noopener"
          data-i18n-aria-label="buyMeACoffee"
          aria-label="Buy me a coffee"
        >
          <img class="bmc-logo" src="icons/bmc-logo.svg" alt="" width="24" height="24" />
          <span class="bmc-text" data-i18n="buyMeACoffee">Buy me a coffee</span>
        </a>
      </div>
    </div>

    <div
      id="folder-emoji-overlay"
      class="overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="folder-emoji-heading"
      hidden
    >
      <div class="overlay-backdrop" id="folder-emoji-backdrop"></div>
      <div class="overlay-card" role="document">
        <div class="overlay-head">
          <h2 id="folder-emoji-heading" data-i18n="folderEmojisHeading">Folder emojis</h2>
          <button
            type="button"
            class="overlay-close"
            id="folder-emoji-close"
            data-i18n-aria-label="folderEmojisDone"
            aria-label="Done"
          >
            ✕
          </button>
        </div>
        <p class="overlay-desc" data-i18n="folderEmojisDescription">
          Paste an emoji to replace a folder's icon. Leave empty to use the default.
        </p>
        <div id="folder-emoji-list" class="folder-emoji-list"></div>
      </div>
    </div>

    <script src="newtab.js"></script>
  </body>
</html>
